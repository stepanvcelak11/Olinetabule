<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tabule</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="board-page">
  <div id="stage">
    <canvas id="bg"></canvas>
    <canvas id="board"></canvas>
    <div id="cursors"></div>
    <textarea id="textEditor" spellcheck="false" hidden></textarea>
  </div>

  <header id="topbar">
    <a href="/" class="brand" title="Domů">✏️ <span>Tabule</span></a>
    <div id="actions">
      <button class="btn icon" id="undoBtn" title="Zpět (Ctrl+Z)">↶</button>
      <button class="btn icon" id="redoBtn" title="Znovu (Ctrl+Y)">↷</button>
      <select id="bgSelect" title="Pozadí tabule">
      <option value="grid">Čtverečky</option>
      <option value="lines">Linky</option>
      <option value="dots">Tečky</option>
      <option value="blank">Čisté</option>
      </select>
      <button class="btn icon" id="exportBtn" title="Uložit jako obrázek (PNG)">⤓</button>
      <button class="btn icon danger" id="clearBtn" title="Vymazat celou tabuli">🗑</button>
    </div>
    <div class="spacer"></div>
    <div id="users"></div>
    <span id="status" class="status" title="Stav připojení"></span>
    <button class="btn primary" id="shareBtn">🔗 <span>Sdílet odkaz</span></button>
  </header>

  <nav id="toolbar">
    <div class="group tools">
      <button class="tool" data-tool="select" title="Výběr a přesun (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
      <button class="tool" data-tool="hand" title="Posun plochy (H, nebo podržet mezerník)"><svg viewBox="0 0 24 24"><path d="M8 12V5a1.5 1.5 0 013 0v6m0-7a1.5 1.5 0 013 0v7m0-6a1.5 1.5 0 013 0v7m0-4a1.5 1.5 0 013 0v6a7 7 0 01-7 7h-1a7 7 0 01-6-3l-3-5a1.5 1.5 0 012.5-1.6L8 15"/></svg></button>
      <button class="tool" data-tool="pen" title="Pero (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4"/></svg></button>
      <button class="tool" data-tool="marker" title="Zvýrazňovač (M)"><svg viewBox="0 0 24 24"><path d="M9 15l-3 5h6l1-2M9 15l8-11 4 3-8 11z" /><path class="fillme" d="M3 21h18" stroke-width="3"/></svg></button>
      <button class="tool" data-tool="eraser" title="Guma (E)"><svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H5l-3-3z M10 9l5 5 M5 19h15"/></svg></button>
      <button class="tool" data-tool="strokeEraser" title="Mazání celých tahů (X)"><svg viewBox="0 0 24 24"><path d="M4 16c3-6 6-8 8-4s5 2 8-4"/><path d="M14 14l6 6m0-6l-6 6" stroke-width="2.5"/></svg></button>
      <button class="tool" data-tool="line" title="Čára (L) – Shift = po 15°"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
      <button class="tool" data-tool="arrow" title="Šipka (A)"><svg viewBox="0 0 24 24"><path d="M4 20L20 4M11 4h9v9"/></svg></button>
      <button class="tool" data-tool="rect" title="Obdélník (R) – Shift = čtverec"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button class="tool" data-tool="ellipse" title="Elipsa (O) – Shift = kruh"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button class="tool" id="imageBtn" title="Vložit obrázek (lze i Ctrl+V nebo přetáhnout)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 18l6-5 4 3 3-2 5 4"/></svg></button>
      <input type="file" id="imageInput" accept="image/*" hidden multiple>
    </div>

    <div class="group colors" id="colors"></div>
    <label class="custom-color" title="Vlastní barva"><input type="color" id="customColor" value="#000000"></label>

    <div class="group sizes" id="sizes"></div>

    <label class="fill-toggle" title="Vyplnit tvary"><input type="checkbox" id="fillShapes"> Výplň</label>
  </nav>


  <div id="zoom">
    <button class="btn icon" id="zoomOut" title="Oddálit">−</button>
    <button class="btn" id="zoomReset" title="Obnovit pohled">100%</button>
    <button class="btn icon" id="zoomIn" title="Přiblížit">+</button>
  </div>

  <div id="selectionBar" hidden>
    <button class="btn" id="dupBtn" title="Duplikovat (Ctrl+D)">⧉ Duplikovat</button>
    <button class="btn danger" id="delBtn" title="Smazat (Delete)">🗑 Smazat</button>
  </div>

  <div id="toast" hidden></div>

  <div id="nameModal" class="modal" hidden>
    <form class="modal-card" id="nameForm">
      <h2>Jak se jmenujete?</h2>
      <p>Jméno uvidí ostatní na tabuli.</p>
      <input id="nameInput" maxlength="40" placeholder="Vaše jméno" autocomplete="name" required>
      <button class="btn primary big" type="submit">Vstoupit na tabuli</button>
    </form>
  </div>

  <div id="dropOverlay" hidden>Pusťte obrázek pro vložení na tabuli</div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/board.js"></script>
</body>
</html>
